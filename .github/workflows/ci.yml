name: CCE CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar projeto e dependências de teste
        run: python -m pip install -e ".[dev]"
      - name: Executar testes
        run: pytest -v
      - name: Executar auditoria da política de exemplo
        run: |
          python -m cce.cli audit \
            --policy config/policy.json \
            --requirements config/requirements.json \
            --output reports/ci-report.json
      - name: Carregar relatório como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cce-audit-report
          path: reports/ci-report.json
          if-no-files-found: ignore
