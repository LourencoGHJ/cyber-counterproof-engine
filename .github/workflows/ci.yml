name: CCE CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar projeto e dependências de teste
        run: python -m pip install -e ".[dev]"
	      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - name: Validar configuração Terraform
        working-directory: infra/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate
      - name: Analisar segurança IaC com Checkov
        run: |
          python -m pip install checkov
          checkov -f infra/terraform/main.tf --framework terraform --compact
      - name: Executar testes
        run: python -m pytest -v
      - name: Analisar segurança do código Python
        run: |
          python -m pip install bandit
          bandit -r src/cce -ll
      - name: Auditar dependências
        run: |
          python -m pip install pip-audit
          pip-audit --skip-editable
      - name: Executar auditoria da política de exemplo
        run: |
          python -m cce.cli audit \
            --policy config/policy.json \
            --requirements config/requirements.json \
            --output reports/ci-report.json
      - name: Carregar relatório como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cce-audit-report
          path: reports/ci-report.json
          if-no-files-found: ignore