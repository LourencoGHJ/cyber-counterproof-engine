name: CCE CodeQL

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read
  actions: read

jobs:
  analyze:
    name: Análise estática CodeQL
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
      - name: Executar análise CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
